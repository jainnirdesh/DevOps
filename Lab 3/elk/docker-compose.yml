services:
  elasticsearch:
    image: elasticsearch:7.17.15
    container_name: lab3-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - elk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: logstash:7.17.15
    container_name: lab3-logstash
    ports:
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:5002:5000/tcp"
      - "127.0.0.1:9600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms128m -Xmx128m
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: kibana:7.17.15
    container_name: lab3-kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy

networks:
  elk:
    driver: bridge
