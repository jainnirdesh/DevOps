services:
  vault:
    image: hashicorp/vault:latest
    container_name: lab4-vault
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${LAB4_VAULT_TOKEN:?Set LAB4_VAULT_TOKEN using the local environment file}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
